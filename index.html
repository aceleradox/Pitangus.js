<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste da Engine v2.0.0 com Som 🦜</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; font-family: sans-serif; }
    #game-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Carregando a versão 2.0.0 via CDN -->
  <script src="https://cdn.jsdelivr.net/gh/aceleradox/Pitangus.js@v2.0.0/pitangus.js"></script>

  <script>
    async function gamemode(PT, PIXI) {
      const { Scene, Level, Sprites, Input, Physics, Tween, Save, Assets, Math: MathU } = PT;

      // --- 1. SISTEMA DE ÁUDIO (Web Audio API) ---
      // Cria sons na hora, sem precisar de arquivos MP3/WAV
      let audioCtx = null;
      function playSound(type) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Nota Lá
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // Sobe uma oitava
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
          } else if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
          }
        } catch (e) { console.warn("Áudio bloqueado pelo navegador", e); }
      }

      // --- 2. ASSETS (SVG da Moeda via Data URI) ---
      const svgCoin = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="14" fill="%23fbbf24" stroke="%23b45309" stroke-width="4"/><text x="16" y="22" font-size="16" text-anchor="middle" fill="%23b45309" font-weight="bold">$</text></svg>`;
      const coinTex = await Assets.loadImage('coin', svgCoin);

      // ==========================================
      // CENA 1: MENU
      // ==========================================
      class MenuScene extends Scene {
        create() {
          const W = this.engine.app.screen.width;
          const H = this.engine.app.screen.height;
          this.container.addChild(Sprites.rect(W, H, 0x0f172a));

          // Texto animado com Tween
          this.title = Sprites.text('🦜 PITANGUS v2.0', { fontSize: 60, fill: 0x06b6d4, bold: true });
          this.title.anchor.set(0.5);
          this.title.x = W / 2;
          this.title.y = H / 3;
          this.container.addChild(this.title);

          // Efeito de pulsar no título
          Tween.to(this.title.scale, { x: 1.1, y: 1.1 }, 1, 'quadInOut');
          setInterval(() => Tween.to(this.title.scale, { x: 1.0, y: 1.0 }, 1, 'quadInOut'), 1000);
          setInterval(() => Tween.to(this.title.scale, { x: 1.1, y: 1.1 }, 1, 'quadInOut'), 2000);

          // Saldo de Moedas Salvas
          const coins = Save.get('coins', 0);
          const coinText = Sprites.text(`💰 Moedas Salvas: ${coins}`, { fontSize: 24, fill: 0xfbbf24 });
          coinText.anchor.set(0.5);
          coinText.x = W / 2; coinText.y = H / 2;
          this.container.addChild(coinText);

          // Botão Play
          this.btnPlay = Sprites.rect(200, 60, 0x8b5cf6);
          this.btnPlay.x = W / 2 - 100; 
          this.btnPlay.y = H / 2 + 80;
          this.container.addChild(this.btnPlay);

          const btnText = Sprites.text('JOGAR', { fontSize: 28, fill: 0xffffff, bold: true });
          btnText.anchor.set(0.5);
          btnText.x = W / 2; btnText.y = H / 2 + 110;
          this.container.addChild(btnText);

          this.btnBox = { x: W / 2 - 100, y: H / 2 + 80, w: 200, h: 60 };
        }

        update() {
          if (Input.mouse.justDown) {
            const m = Input.mouse;
            if (Physics.hit({ x: m.x, y: m.y, w: 1, h: 1 }, this.btnBox)) {
              // Inicia o som aqui! O clique desbloqueia o áudio no navegador.
              if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              playSound('jump'); 
              this.engine.start('Game', { level: 1 });
            }
          }
        }
      }

      // ==========================================
      // CENA 2: JOGO
      // ==========================================
      class GameScene extends Level {
        create() {
          // 1. Chão
          const ground = Sprites.rect(3000, 100, 0x1e293b);
          ground.y = 600;
          this.world.addChild(ground);
          this.platforms = [{ x: 0, y: 600, w: 3000, h: 100 }];

          // 2. Plataformas no ar
          for (let i = 0; i < 5; i++) {
            const p = Sprites.rect(200, 30, 0x334155);
            p.x = 400 + i * 400;
            p.y = 450 - (i % 2) * 100;
            this.world.addChild(p);
            this.platforms.push({ x: p.x, y: p.y, w: 200, h: 30 });
          }

          // 3. Player
          this.player = Sprites.player(0x06b6d4);
          this.player.x = 100;
          this.player.y = 400;
          this.world.addChild(this.player);
          
          this.vx = 0; this.vy = 0;
          this.grounded = false;
          this.camera.follow(this.player);

          // 4. Inimigo
          this.enemy = Sprites.circle(20, 0xef4444);
          this.enemy.x = 700; this.enemy.y = 380;
          this.world.addChild(this.enemy);
          
          Tween.to(this.enemy, { y: 550 }, 1.5, 'quadInOut');
          setInterval(() => Tween.to(this.enemy, { y: 380 }, 1.5, 'quadInOut'), 1500);
          setInterval(() => Tween.to(this.enemy, { y: 550 }, 1.5, 'quadInOut'), 3000);

          // 5. Moedas
          this.coins = [];
          for (let i = 0; i < 10; i++) {
            const coin = new PIXI.Sprite(coinTex);
            coin.anchor.set(0.5);
            coin.x = MathU.randomInt(300, 2800);
            coin.y = MathU.randomInt(300, 550);
            this.world.addChild(coin);
            this.coins.push({ spr: coin, w: 32, h: 32, x: coin.x, y: coin.y, coletada: false });
          }

          // HUD
          this.coinHud = Sprites.text('💰 0', { fontSize: 24, fill: 0xfbbf24 });
          this.coinHud.x = 20; this.coinHud.y = 20;
          this.ui.addChild(this.coinHud);
          this.coletadasNestaSessao = 0;
        }

        update(dt) {
          super.update(dt);

          // --- FÍSICA DO PLAYER ---
          const axis = Input.axis();
          this.vx = axis.x * 300;
          
          // Pulo com SOM
          if (Input.pressed('Space') && this.grounded) {
            this.vy = -700;
            this.grounded = false;
            playSound('jump'); // Toca o som de pulo
          }

          this.vy += 2000 * dt;
          this.player.x += this.vx * dt;
          this.player.x = MathU.clamp(this.player.x, 20, 2980);
          this.player.y += this.vy * dt;
          this.grounded = false;

          const pBox = { x: this.player.x - 14, y: this.player.y - 20, w: 28, h: 40 };

          for (const plat of this.platforms) {
            if (Physics.hit(pBox, plat)) {
              if (this.vy > 0) {
                this.player.y = plat.y - 20;
                this.vy = 0;
                this.grounded = true;
              } else if (this.vy < 0) {
                this.player.y = plat.y + plat.h + 20;
                this.vy = 0;
              }
            }
          }

          // --- COLETA DE MOEDAS ---
          for (const c of this.coins) {
            if (!c.coletada && Physics.hit(pBox, c)) {
              c.coletada = true;
              c.spr.visible = false;
              
              playSound('coin'); // Toca o som da moeda
              this.coletadasNestaSessao++;
              this.coinHud.text = '💰 ' + this.coletadasNestaSessao;
              Save.add('coins', 1);
            }
          }

          // Colisão com inimigo
          if (Physics.hit(pBox, { x: this.enemy.x - 20, y: this.enemy.y - 20, w: 40, h: 40 })) {
            this.player.x = 100;
            this.player.y = 400;
            this.vy = 0;
          }
        }
      }

      // ==========================================
      // INICIALIZAÇÃO
      // ==========================================
      PT.register('Menu', MenuScene);
      PT.register('Game', GameScene);
      PT.start('Menu');
    }
  </script>
</body>
</html>
